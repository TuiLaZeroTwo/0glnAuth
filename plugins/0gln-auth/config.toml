# 0gln Auth example configuration.
#
# On first start the plugin writes a fresh copy of this file (with these
# same defaults) into its data folder (on the server, under
# plugins/data/0gln Auth/). Edit THAT copy and restart the server; this
# repo copy is only a reference example.

# Seconds an unauthenticated player may stay on the server before being
# kicked. While unauthenticated the player is frozen (no move/chat/commands
# except auth commands). Default: 120.
timeout_secs = 120

# Minutes a successful login is remembered. Rejoining from the same IP
# within this window silently resumes the session (no /login needed).
# Default: 120.
session_minutes = 120

# Failed /login attempts from one IP before that player is kicked with the
# rate-limit message. The counter resets ONLY on a successful login —
# reconnecting does not reset it. Default: 5.
max_login_tries = 5

# Minimum and maximum password length (in bytes). Default: 8 and 64.
pw_min_len = 8
pw_max_len = 64

# Regex new player names must match. Kept in sync with Minecraft's default
# name rules (3-16 chars, letters/digits/underscore). Default shown.
name_regex = '^[a-zA-Z0-9_]{3,16}$'

# Whether the /premium command may ask Mojang's session servers whether the
# joining name belongs to a premium (paid) account. Requires the
# http.outbound plugin permission and outbound internet access from the
# server host. Default: true.
premium_check_enabled = true

# How long a premium/cracked verdict from Mojang is cached (minutes), to
# avoid hammering the API on relogs. Default: 45.
premium_cache_minutes = 45

# Player-facing messages. Every key below can be overridden with your own
# text; keys you omit keep the built-in default, and unknown keys are
# ignored. Keys must be quoted because they contain dots.
[messages]
"join.choice" = "Are you premium or cracked? Use /premium to verify a premium name, or /register <password> <confirm> to create a cracked account."
"join.login" = "Please login: /login <password>"
"join.register" = "Please register: /register <password> <confirm>"
"login.already" = "You are already logged in."
"login.duplicate" = "Already logged in from another session."
"login.ok" = "Logged in."
"login.rate_limited" = "Too many failed login attempts."
"login.wrong" = "Wrong password."
"premium.auto" = "Premium account detected, logged in."
"premium.exists" = "An account with this name already exists, use /login."
"premium.nopass" = "Account has no password, set a password first."
"premium.not" = "That name is not premium, use /register."
"premium.ok" = "Premium verified, welcome."
"premium.unavailable" = "Could not verify premium status, try again later."
"premium.uuid_mismatch" = "This is a premium name: join with your premium (Mojang-signed-in) launcher."
"premium.uuid_wrong" = "You are not using this account's launcher: premium verification requires joining with the Mojang-signed-in launcher."
"register.exists" = "An account with this name already exists. Use /login."
"register.mismatch" = "Passwords do not match."
"register.ok" = "Registered and logged in."
"session.resume" = "Session resumed, welcome back."
"timeout.kick" = "Login timeout."
